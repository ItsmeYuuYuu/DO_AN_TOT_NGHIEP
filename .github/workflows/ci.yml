name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    - name: Restore dependencies
      run: dotnet restore BackEnd/ECommerceBackend.sln
    - name: Build
      run: dotnet build BackEnd/ECommerceBackend.sln --no-restore
    - name: Test
      run: dotnet test BackEnd/ECommerceBackend.sln --no-build --verbosity normal

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install dependencies
      working-directory: FrontEnd
      run: npm ci
    - name: Lint
      working-directory: FrontEnd
      run: npm run lint
    - name: Build
      working-directory: FrontEnd
      run: npm run build
